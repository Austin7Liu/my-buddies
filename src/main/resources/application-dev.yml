spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/my_buddies?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:10}
      minimum-idle: ${MYSQL_MIN_IDLE:2}
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT:30000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}

logging:
  level:
    com.austin: debug
    com.baomidou.mybatisplus: info
