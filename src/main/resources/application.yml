spring:
  application:
    name: my-buddies
  profiles:
    default: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  sms-code:
    expiration: 5m
    resend-cooldown: 60s
    max-failed-attempts: 5
    lock-duration: 5m
  account:
    cancellation-cooling-off-period: 7d
  identity:
    fingerprint-secret: ${IDENTITY_FINGERPRINT_SECRET:}
    minimum-age: 18
  jwt:
    issuer: ${JWT_ISSUER:my-buddies}
    secret: ${JWT_SECRET:}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:7d}
